name: Create Greenmask release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build.yml
    needs:
      - tests
    secrets: inherit

  docs:
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
    needs: 
      - build
      